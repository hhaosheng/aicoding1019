# 全局置信度权重基线。
#
# 这个文件不产生任何规则，只提供「规则 → pack → 基线」继承链的最后一环：
# 规则自己写 score 就覆盖，不写就继承所属 pack 的 score，pack 不写就落到这里。
#
# 想让整体置信度更保守/更激进，只改本文件即可，不需要碰任何 Go 代码。
version: 1
pack: _base
description: "全局置信度权重基线"
score:
  protocol: 0.60            # 命中某个协议的签名（一切识别的起点）
  product: 0.15             # 抽出产品名
  version: 0.10             # 抽出具体版本号
  os_hint: 0.05             # 抽出操作系统线索
  port_agree: 0.05          # 观测端口落在规则声明的 ports 内（弱先验，权重刻意压得很低）
  ceiling: 0.95             # 全量命中时的上限；留 0.05 给「无法证伪」这件事本身
  ceiling_no_version: 0.75  # 没抽到版本时的上限，默认比有版本时低一档
rules: []
